[mod-setting-name]
pq-min-players=Minimum players
pq-relock-on-drop=Re-lock when count drops
pq-allowed-players=Counted players (whitelist)
pq-count-admins=Count admins

[mod-setting-description]
pq-min-players=Players that must be online before anyone can play. While waiting, players are locked and biters are frozen; factories and research keep running.
pq-relock-on-drop=If the online count falls below the minimum, lock everyone again. If off, the game continues until the server empties.
pq-allowed-players=Comma or space separated usernames. Only these count toward the minimum. Blank = everyone counts.
pq-count-admins=If off, admins don't count toward the minimum (they are still locked while waiting).
